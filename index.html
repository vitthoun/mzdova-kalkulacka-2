<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mzdová kalkulačka</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5}body.dark{background:#121212;color:#fff}header{background:#0078d4;color:#fff;padding:15px;text-align:center}.container{max-width:1000px;margin:auto;padding:20px}.tabs{display:flex;gap:10px;margin-bottom:20px}.tab{padding:10px 20px;border:none;cursor:pointer;background:#ddd}.tab.active{background:#0078d4;color:#fff}.page{display:none;background:#fff;padding:20px;border-radius:8px}.page.active{display:block}body.dark .page{background:#1e1e1e}.form-group{margin-bottom:12px}label{display:block;font-weight:bold;margin-bottom:4px}input,select{width:100%;padding:8px;box-sizing:border-box}body.dark input,body.dark select{background:#2b2b2b;color:#fff;border:1px solid #555}button{padding:12px 20px;background:#0078d4;color:#fff;border:none;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:20px}td{border-bottom:1px solid #ddd;padding:8px}td:last-child{text-align:right}.total{background:#e8f4ff;font-weight:bold}body.dark .total{background:#003b6f}</style></head><body><header><h1>Mzdová kalkulačka</h1></header><div class="container"><div class="tabs"><button class="tab active" onclick="showPage('vypocet',this)">Výpočet</button><button class="tab" onclick="showPage('nastaveni',this)">Nastavení</button></div><div id="vypocet" class="page active"><div class=form-group><label>Měsíc</label><select id=mesic><option value=1>Leden</option><option value=2>Únor</option><option value=3>Březen</option><option value=4>Duben</option><option value=5>Květen</option><option value=6>Červen</option><option value=7>Červenec</option><option value=8>Srpen</option><option value=9>Září</option><option value=10>Říjen</option><option value=11>Listopad</option><option value=12>Prosinec</option></select></div><div class=form-group><label>Rok</label><input id=rok type=number value=2026></div><div class=form-group><label>Odpracované hodiny</label><input id=odpracovane type=number step=0.01></div><div class=form-group><label>Náhrady</label><input id=nahrady type=number step=0.01></div><div class=form-group><label>Hodiny práce ve svátek</label><input id=svatek type=number step=0.01></div><div class=form-group><label>Víkendové hodiny</label><input id=vikend type=number step=0.01></div><div class=form-group><label>Odpolední hodiny</label><input id=odpoledni type=number step=0.01></div><div class=form-group><label>Noční hodiny</label><input id=nocni type=number step=0.01></div><div class=form-group><label>Mezera mezi dělenými směnami</label><input id=mezera type=number step=0.01></div><div class=form-group><label>Hodiny v dělené směně</label><input id=delena type=number step=0.01></div><button onclick="spocitat()">Spočítat</button><div id=vysledek></div></div><div id="nastaveni" class="page"><div class=form-group><label>Hodinová mzda</label><input id=s_hodinovka value=313.3></div><div class=form-group><label>Průměrný výdělek</label><input id=s_prumer value=313.3></div><div class=form-group><label>Věrnostní Kč/h</label><input id=s_vernostni value=0></div><div class=form-group><label>Osobní %</label><input id=s_osobni value=10></div><div class=form-group><label>Přesčas %</label><input id=s_prescas value=25></div><div class=form-group><label>Víkend %</label><input id=s_vikend value=35></div><div class=form-group><label>Odpolední %</label><input id=s_odpoledni value=1.5></div><div class=form-group><label>Noční %</label><input id=s_nocni value=10></div><div class=form-group><label>Svátek %</label><input id=s_svatek value=100></div><div class=form-group><label>Nerovnoměrná PD %</label><input id=s_nerovnomerna value=0.5></div><div class=form-group><label>Mezera Kč/h</label><input id=s_mezera value=82.4></div><div class=form-group><label>Dělená směna Kč/h</label><input id=s_delena value=5.2></div><div class=form-group><label>LETMO Kč/h</label><input id=s_letmo value=3.8></div><div class=form-group><label><input type=checkbox id=darkMode> Tmavý režim</label></div><button onclick="ulozitNastaveni()">Uložit nastavení</button></div></div><script>function showPage(i,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(i).classList.add('active');b.classList.add('active')}function ulozitNastaveni(){document.querySelectorAll('#nastaveni input').forEach(i=>localStorage.setItem(i.id,i.type==='checkbox'?(i.checked?'1':'0'):i.value));alert('Uloženo')}function nacti(){document.querySelectorAll('#nastaveni input').forEach(i=>{let v=localStorage.getItem(i.id);if(v!==null){if(i.type==='checkbox')i.checked=v==='1';else i.value=v}});if(document.getElementById('darkMode').checked)document.body.classList.add('dark')}function kc(x){return x.toLocaleString('cs-CZ',{minimumFractionDigits:2,maximumFractionDigits:2})+' Kč'}function fpd(m,r){let d=0,p=new Date(r,m,0).getDate();for(let i=1;i<=p;i++){let t=new Date(r,m-1,i).getDay();if(t!=0&&t!=6)d++}return d*8}document.addEventListener('change',e=>{if(e.target.id==='darkMode'){document.body.classList.toggle('dark',e.target.checked);localStorage.setItem('darkMode',e.target.checked?'1':'0')}});function spocitat(){const g=id=>parseFloat(document.getElementById(id).value)||0;let hodinovka=g('s_hodinovka'),prumer=g('s_prumer');let od=g('odpracovane'),nah=g('nahrady'),sv=g('svatek'),vi=g('vikend'),op=g('odpoledni'),no=g('nocni'),me=g('mezera'),de=g('delena');let fond=fpd(parseInt(mesic.value),parseInt(rok.value));let pres=Math.max(0,od+nah-fond);let hr=od*hodinovka+nah*prumer+(od*hodinovka)*(g('s_osobni')/100)+od*g('s_vernostni')+pres*(prumer*g('s_prescas')/100)+vi*(prumer*g('s_vikend')/100)+op*(prumer*g('s_odpoledni')/100)+no*(prumer*g('s_nocni')/100)+sv*(prumer*g('s_svatek')/100)+od*(prumer*g('s_nerovnomerna')/100)+me*g('s_mezera')+de*g('s_delena')+od*g('s_letmo');vysledek.innerHTML='<table><tr><td>FPD</td><td>'+fond+' h</td></tr><tr><td>Přesčas</td><td>'+pres.toFixed(2)+' h</td></tr><tr class=total><td>Hrubá mzda</td><td>'+kc(hr)+'</td></tr></table>'}nacti();</script></body></html>
